<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>初中數學：Chapter 4 幾何定理隨機出題器</title>
    
    <!-- MathJax 3 渲染引擎 -->
    <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']]
      },
      svg: { fontCache: 'global' }
    };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        :root {
            --primary-color: #2b6cb0;
            --secondary-color: #38a169;
            --bg-color: #f7fafc;
            --card-bg: #ffffff;
            --text-color: #2d3748;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 960px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            color: #718096;
            margin-bottom: 25px;
        }

        .controls {
            display: flex;
            gap: 12px;
            justify-content: center;
            align-items: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
            background: #edf2f7;
            padding: 15px;
            border-radius: 8px;
        }

        select, button {
            padding: 10px 14px;
            font-size: 15px;
            border-radius: 6px;
            border: 1px solid #cbd5e0;
            outline: none;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            cursor: pointer;
            transition: background 0.2s;
            font-weight: bold;
        }

        button:hover { background-color: #2c5282; }
        .btn-secondary { background-color: var(--secondary-color); }
        .btn-secondary:hover { background-color: #276749; }

        .workspace {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .svg-container {
            border: 2px dashed #cbd5e0;
            border-radius: 8px;
            background: #fff;
            padding: 10px;
            overflow: visible;
        }

        .question-box {
            width: 100%;
            background: #ebf8ff;
            border-left: 5px solid var(--primary-color);
            padding: 18px;
            border-radius: 4px;
            font-size: 18px;
            box-sizing: border-box;
        }

        .solution-box {
            width: 100%;
            background: #f0fff4;
            border-left: 5px solid var(--secondary-color);
            padding: 18px;
            border-radius: 4px;
            font-size: 16px;
            display: none;
            line-height: 1.8;
            box-sizing: border-box;
        }

        .badge {
            display: inline-block;
            padding: 3px 8px;
            font-size: 12px;
            font-weight: bold;
            color: white;
            border-radius: 4px;
            margin-bottom: 8px;
        }
        .badge-lvl1 { background-color: #4299e1; }
        .badge-lvl2 { background-color: #ed8936; }

        .math-label {
            font-size: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            white-space: nowrap;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>初中數學：幾何定理隨機出題器</h1>
    <div class="subtitle">Book 2A Chapter 4 Angles related to Rectilinear Figures</div>

    <div class="controls">
        <label for="topicSelect"><b>選擇章節主題：</b></label>
        <select id="topicSelect">
            <option value="extAngle">4.1 三角形內角和及外角</option>
            <option value="isosceles">4.2 等腰三角形</option>
            <option value="equilateral">4.2 等邊三角形</option>
            <option value="sidesOpp">4.2 等角對邊相等</option>
            <option value="polygonInt">4.3 多邊形內角和</option>
            <option value="polygonExt">4.3 多邊形外角和</option>
        </select>

        <label for="levelSelect"><b>程度：</b></label>
        <select id="levelSelect">
            <option value="1">程度一（基礎概念）</option>
            <option value="2">程度二（複合圖形與綜合題）</option>
        </select>

        <button onclick="generateQuestion()">🎲 生成新題目</button>
        <button class="btn-secondary" onclick="toggleSolution()">💡 顯示/隱藏解答</button>
    </div>

    <div class="workspace">
        <div class="svg-container">
            <svg id="geoSvg" width="520" height="300" viewBox="0 0 520 300"></svg>
        </div>

        <div class="question-box" id="questionText">
            請選擇主題及程度後點擊「生成新題目」。
        </div>

        <div class="solution-box" id="solutionText">
        </div>
    </div>
</div>

<script>
    function getRandomInt(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function toggleSolution() {
        const solBox = document.getElementById('solutionText');
        solBox.style.display = (solBox.style.display === 'none' || solBox.style.display === '') ? 'block' : 'none';
    }

    function refreshMath() {
        if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise([
                document.getElementById('geoSvg'),
                document.getElementById('questionText'),
                document.getElementById('solutionText')
            ]);
        }
    }

    function getExtendedPoint(p1, p2, len = 45) {
        let dx = p2.x - p1.x;
        let dy = p2.y - p1.y;
        let dist = Math.hypot(dx, dy);
        return {
            x: p2.x + (dx / dist) * len,
            y: p2.y + (dy / dist) * len
        };
    }

    function createParallelArrow(p1, p2, color = "#2b6cb0") {
        let mx = (p1.x + p2.x) / 2;
        let my = (p1.y + p2.y) / 2;
        let angleDeg = Math.atan2(p2.y - p1.y, p2.x - p1.x) * (180 / Math.PI);
        
        return `
            <g transform="translate(${mx}, ${my}) rotate(${angleDeg})">
                <path d="M -6 -5 L 2 0 L -6 5" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </g>
        `;
    }

    function createAngleArc(v, p1, p2, r, label, color = "#e53e3e", shiftX = 0, shiftY = 0) {
        let a1 = Math.atan2(p1.y - v.y, p1.x - v.x);
        let a2 = Math.atan2(p2.y - v.y, p2.x - v.x);
        
        let diff = a2 - a1;
        while (diff < -Math.PI) diff += 2 * Math.PI;
        while (diff > Math.PI) diff -= 2 * Math.PI;
        
        let startAngle = a1;
        let endAngle = a1 + diff;
        
        let sx = v.x + r * Math.cos(startAngle);
        let sy = v.y + r * Math.sin(startAngle);
        let ex = v.x + r * Math.cos(endAngle);
        let ey = v.y + r * Math.sin(endAngle);
        
        let largeArcFlag = Math.abs(diff) > Math.PI ? 1 : 0;
        let sweepFlag = diff > 0 ? 1 : 0;
        
        let pathD = `M ${sx} ${sy} A ${r} ${r} 0 ${largeArcFlag} ${sweepFlag} ${ex} ${ey}`;
        
        let labelHtml = '';
        if (label && label.trim() !== '') {
            let midAngle = a1 + diff / 2;
            let lx = v.x + (r + 28) * Math.cos(midAngle);
            let ly = v.y + (r + 28) * Math.sin(midAngle);
            labelHtml = `
            <foreignObject x="${lx - 45 + shiftX}" y="${ly - 15 + shiftY}" width="90" height="30">
                <div xmlns="http://www.w3.org/1999/xhtml" class="math-label" style="color:${color}; font-weight:bold; overflow:visible;">
                    $${label}$
                </div>
            </foreignObject>`;
        }
        
        return `
            <path d="${pathD}" fill="none" stroke="${color}" stroke-width="1.8" />
            ${labelHtml}
        `;
    }

    function createArcTick(v, p1, p2, r, color="#2b6cb0") {
        let a1 = Math.atan2(p1.y - v.y, p1.x - v.x);
        let a2 = Math.atan2(p2.y - v.y, p2.x - v.x);
        let diff = a2 - a1;
        while (diff < -Math.PI) diff += 2 * Math.PI;
        while (diff > Math.PI) diff -= 2 * Math.PI;
        let mid = a1 + diff/2;
        let tx = v.x + r * Math.cos(mid);
        let ty = v.y + r * Math.sin(mid);
        let dx = 4 * Math.cos(mid + Math.PI/2);
        let dy = 4 * Math.sin(mid + Math.PI/2);
        return `<line x1="${tx - dx}" y1="${ty - dy}" x2="${tx + dx}" y2="${ty + dy}" stroke="${color}" stroke-width="2"/>`;
    }

    function createVertexLabel(p, label, offX = 0, offY = 0) {
        return `
            <foreignObject x="${p.x + offX - 20}" y="${p.y + offY - 15}" width="40" height="30">
                <div xmlns="http://www.w3.org/1999/xhtml" class="math-label" style="color:#2d3748; font-weight:bold;">
                    $${label}$
                </div>
            </foreignObject>
        `;
    }

    function generateQuestion() {
        const topic = document.getElementById('topicSelect').value;
        const level = parseInt(document.getElementById('levelSelect').value);
        const svg = document.getElementById('geoSvg');
        const qText = document.getElementById('questionText');
        const solText = document.getElementById('solutionText');
        
        svg.innerHTML = '';
        solText.style.display = 'none';

        const badgeHtml = `<span class="badge ${level === 1 ? 'badge-lvl1' : 'badge-lvl2'}">程度 ${level === 1 ? '一' : '二（綜合題）'}</span><br>`;

        switch(topic) {
            case 'extAngle': generateExtAngle(svg, qText, solText, level, badgeHtml); break;
            case 'isosceles': generateIsosceles(svg, qText, solText, level, badgeHtml); break;
            case 'equilateral': generateEquilateral(svg, qText, solText, level, badgeHtml); break;
            case 'sidesOpp': generateSidesOpp(svg, qText, solText, level, badgeHtml); break;
            case 'polygonInt': generatePolygonInt(svg, qText, solText, level, badgeHtml); break;
            case 'polygonExt': generatePolygonExt(svg, qText, solText, level, badgeHtml); break;
        }

        refreshMath();
    }

    // ==========================================
    // 1. 三角形內角和及外角 (4.1)
    // ==========================================
    function generateExtAngle(svg, qText, solText, level, badge) {
        if (level === 1) {
            const type = getRandomInt(1, 3);
            let angleA, angleB;
            if (type === 1) { 
                angleA = getRandomInt(50, 70); angleB = getRandomInt(50, 70);
            } else if (type === 2) { 
                angleA = getRandomInt(100, 125); angleB = getRandomInt(20, 35);
            } else { 
                angleA = getRandomInt(20, 35); angleB = getRandomInt(100, 125);
            }
            const ans = angleA + angleB;

            let radA = angleA * Math.PI / 180;
            let radB = angleB * Math.PI / 180;
            let radC = Math.PI - radA - radB;
            
            let baseBC = 160;
            let sideAB = baseBC * Math.sin(radC) / Math.sin(radA);
            
            let ptB = {x: 0, y: 0};
            let ptC = {x: baseBC, y: 0};
            let ptA = {x: sideAB * Math.cos(radB), y: -sideAB * Math.sin(radB)};
            let ptD = {x: baseBC + 90, y: 0};
            
            let minX = Math.min(ptA.x, ptB.x, ptC.x, ptD.x);
            let maxX = Math.max(ptA.x, ptB.x, ptC.x, ptD.x);
            let minY = Math.min(ptA.y, ptB.y, ptC.y, ptD.y);
            
            let currentWidth = maxX - minX;
            let currentHeight = -minY; 
            
            let scale = 1;
            if (currentWidth > 440) scale = 440 / currentWidth;
            if (currentHeight > 180) scale = Math.min(scale, 180 / currentHeight);
            
            ptA = {x: ptA.x * scale, y: ptA.y * scale};
            ptB = {x: ptB.x * scale, y: ptB.y * scale};
            ptC = {x: ptC.x * scale, y: ptC.y * scale};
            ptD = {x: ptD.x * scale, y: ptD.y * scale};
            
            currentWidth = Math.max(ptA.x, ptB.x, ptC.x, ptD.x) - Math.min(ptA.x, ptB.x, ptC.x, ptD.x);
            let offsetX = (520 - currentWidth) / 2 - Math.min(ptA.x, ptB.x, ptC.x, ptD.x);
            let offsetY = 240; 
            
            const A = {x: ptA.x + offsetX, y: ptA.y + offsetY};
            const B = {x: ptB.x + offsetX, y: ptB.y + offsetY};
            const C = {x: ptC.x + offsetX, y: ptC.y + offsetY};
            const D = {x: ptD.x + offsetX, y: ptD.y + offsetY};

            svg.innerHTML = `
                <line x1="${B.x}" y1="${B.y}" x2="${D.x}" y2="${D.y}" stroke="#2d3748" stroke-width="2"/>
                <line x1="${A.x}" y1="${A.y}" x2="${B.x}" y2="${B.y}" stroke="#2d3748" stroke-width="2"/>
                <line x1="${A.x}" y1="${A.y}" x2="${C.x}" y2="${C.y}" stroke="#2d3748" stroke-width="2"/>
                ${createVertexLabel(A, 'A', 0, -15)} ${createVertexLabel(B, 'B', -12, 12)}
                ${createVertexLabel(C, 'C', 0, 15)} ${createVertexLabel(D, 'D', 12, 12)}
                ${createAngleArc(A, B, C, 22, `${angleA}^\\circ`)}
                ${createAngleArc(B, C, A, 25, `${angleB}^\\circ`)}
                ${createAngleArc(C, A, D, 22, 'x', '#2b6cb0')}
            `;
            qText.innerHTML = `${badge}<b>題目：</b>求圖中的未知角 $x$。（已知 $BCD$ 為一直線）`;
            solText.innerHTML = `<b>詳細解題步驟：</b>
            $$\\begin{aligned}
            x &= \\angle BAC + \\angle ABC && (\\text{ext. } \\angle \\text{ of } \\Delta) \\\\
            x &= ${angleA}^\\circ + ${angleB}^\\circ \\\\
            x &= ${ans}^\\circ
            \\end{aligned}$$`;
        } else {
            const variant = getRandomInt(1, 4);
             if (variant === 1) {
                const angleA = getRandomInt(45, 65), angleB = getRandomInt(50, 70);
                const angleAEB = 180 - (angleA + angleB), angleD = getRandomInt(45, 65);
                const ans = 180 - (angleAEB + angleD);
                
                const radA = angleA * Math.PI / 180, radB = angleB * Math.PI / 180;
                
                let baseAB = 200; 
                let h = baseAB / (1/Math.tan(radA) + 1/Math.tan(radB));
                if (h > 165) { 
                    let scale = 165 / h;
                    baseAB *= scale;
                    h = 165;
                }
                
                const A = {x: 260 - baseAB/2, y: 35}, B = {x: 260 + baseAB/2, y: 35};
                const E = {x: A.x + h / Math.tan(radA), y: A.y + h};
                
                const lenED = 60; 
                const dxB = E.x - B.x, dyB = E.y - B.y;
                const distBE = Math.hypot(dxB, dyB);
                const D = {x: E.x + (dxB / distBE) * lenED, y: E.y + (dyB / distBE) * lenED};

                const lenEC = lenED * Math.sin(angleD * Math.PI / 180) / Math.sin(ans * Math.PI / 180);
                const dxA = E.x - A.x, dyA = E.y - A.y;
                const distAE = Math.hypot(dxA, dyA);
                const C = {x: E.x + (dxA / distAE) * lenEC, y: E.y + (dyA / distAE) * lenEC};
                svg.innerHTML = `
                    <line x1="${A.x}" y1="${A.y}" x2="${C.x}" y2="${C.y}" stroke="#2d3748" stroke-width="2"/>
                    <line x1="${B.x}" y1="${B.y}" x2="${D.x}" y2="${D.y}" stroke="#2d3748" stroke-width="2"/>
                    <line x1="${A.x}" y1="${A.y}" x2="${B.x}" y2="${B.y}" stroke="#2d3748" stroke-width="2"/>
                    <line x1="${C.x}" y1="${C.y}" x2="${D.x}" y2="${D.y}" stroke="#2d3748" stroke-width="2"/>
                    ${createVertexLabel(A, 'A', -12, -10)} ${createVertexLabel(B, 'B', 12, -10)}
                    ${createVertexLabel(E, 'E', 18, -8)} ${createVertexLabel(C, 'C', 12, 12)} ${createVertexLabel(D, 'D', -12, 12)}
                    ${createAngleArc(A, B, E, 22, `${angleA}^\\circ`)} ${createAngleArc(B, E, A, 22, `${angleB}^\\circ`)}
                    ${createAngleArc(D, E, C, 22, `${angleD}^\\circ`)} ${createAngleArc(C, D, E, 22, 'x', '#2b6cb0')}
                `;
                qText.innerHTML = `${badge}<b>題目：</b>圖中 $AC$ 與 $BD$ 相交於 $E$，求未知角 $x$。`;
                solText.innerHTML = `<b>詳細解題步驟：</b>
                $$\\begin{aligned}
                \\angle AEB + \\angle BAE + \\angle ABE &= 180^\\circ && (\\angle \\text{ sum of } \\Delta) \\\\
                \\angle AEB + ${angleA}^\\circ + ${angleB}^\\circ &= 180^\\circ \\\\
                \\angle AEB &= ${angleAEB}^\\circ \\\\
                \\angle CED &= \\angle AEB = ${angleAEB}^\\circ && (\\text{vert. opp. } \\angle\\text{s}) \\\\
                x + \\angle CED + \\angle EDC &= 180^\\circ && (\\angle \\text{ sum of } \\Delta) \\\\
                x + ${angleAEB}^\\circ + ${angleD}^\\circ &= 180^\\circ \\\\
                x &= ${ans}^\\circ
                \\end{aligned}$$`;
            } else if (variant === 2) {
                const topAngle = getRandomInt(45, 65), aefAngle = getRandomInt(50, 70);
                const ans = topAngle + aefAngle;
                const B = {x: 130, y: 220}, D = {x: 480, y: 220};
                const radB = aefAngle * Math.PI / 180;
                let h = 150;
                let baseOffset = h / Math.tan(radB);
                const A = {x: B.x + baseOffset, y: B.y - h};
                const radC = Math.PI - (topAngle * Math.PI / 180) - radB;
                const C = {x: A.x + h / Math.tan(radC), y: B.y};
                const E = {x: (A.x + B.x)/2, y: (A.y + B.y)/2}, F = {x: (A.x + C.x)/2, y: (A.y + C.y)/2};

                svg.innerHTML = `
                    <line x1="${B.x}" y1="${B.y}" x2="${D.x}" y2="${D.y}" stroke="#2d3748" stroke-width="2"/>
                    <polygon points="${A.x},${A.y} ${B.x},${B.y} ${C.x},${C.y}" fill="none" stroke="#2d3748" stroke-width="2"/>
                    <line x1="${E.x}" y1="${E.y}" x2="${F.x}" y2="${F.y}" stroke="#2d3748" stroke-width="2"/>
                    ${createParallelArrow(E, F)} ${createParallelArrow(B, C)}
                    ${createVertexLabel(A, 'A', 0, -12)} ${createVertexLabel(B, 'B', -12, 12)} ${createVertexLabel(C, 'C', 0, 15)}
                    ${createVertexLabel(D, 'D', 12, 12)} ${createVertexLabel(E, 'E', -15, -5)} ${createVertexLabel(F, 'F', 15, -5)}
                    ${createAngleArc(A, B, C, 25, `${topAngle}^\\circ`, '#e53e3e', 0, -5)} 
                    ${createAngleArc(E, F, A, 25, `${aefAngle}^\\circ`, '#e53e3e', 15, 10)}
                    ${createAngleArc(C, A, D, 22, 'x', '#2b6cb0')}
                `;
                qText.innerHTML = `${badge}<b>題目：</b>已知 $BCD$ 為一直線，$E$ 與 $F$ 分別在 $AB$ 及 $AC$ 上，且 $EF // BD$。求未知外角 $x = \\angle ACD$。`;
                solText.innerHTML = `<b>詳細解題步驟：</b>
                $$\\begin{aligned}
                \\angle ABC &= \\angle AEF = ${aefAngle}^\\circ && (\\text{corr. } \\angle\\text{s, } EF // BD) \\\\
                x &= \\angle BAC + \\angle ABC && (\\text{ext. } \\angle \\text{ of } \\Delta) \\\\
                x &= ${topAngle}^\\circ + ${aefAngle}^\\circ \\\\
                x &= ${ans}^\\circ
                \\end{aligned}$$`;
            } else if (variant === 3) {
                const angleA = getRandomInt(55, 75);
                const extABD = getRandomInt(115, 140);
                const angleABC = 180 - extABD;
                const ans = angleA + angleABC;

                const B = {x: 180, y: 190}, C = {x: 320, y: 190}, D = {x: 70, y: 190};
                const radB = angleABC * Math.PI / 180, radA = angleA * Math.PI / 180;
                const radC = Math.PI - radB - radA;
                
                let distBC = 120;
                let h = distBC * Math.sin(radB) * Math.sin(radC) / Math.sin(radA);
                if (h > 150) distBC *= (150 / h);
                const distAB = distBC * Math.sin(radC) / Math.sin(radA);
                
                const A = {x: B.x + distAB * Math.cos(radB), y: B.y - distAB * Math.sin(radB)};
                const E = getExtendedPoint(A, C, 80);

                svg.innerHTML = `
                    <line x1="${D.x}" y1="${D.y}" x2="${C.x}" y2="${C.y}" stroke="#2d3748" stroke-width="2"/>
                    <line x1="${A.x}" y1="${A.y}" x2="${B.x}" y2="${B.y}" stroke="#2d3748" stroke-width="2"/>
                    <line x1="${A.x}" y1="${A.y}" x2="${E.x}" y2="${E.y}" stroke="#2d3748" stroke-width="2"/>
                    ${createVertexLabel(A, 'A', 0, -12)} ${createVertexLabel(B, 'B', -5, 15)}
                    ${createVertexLabel(C, 'C', 0, 15)} ${createVertexLabel(D, 'D', 0, 15)} ${createVertexLabel(E, 'E', 15, 10)}
                    ${createAngleArc(B, D, A, 22, `${extABD}^\\circ`)}
                    ${createAngleArc(A, C, B, 28, `${angleA}^\\circ`, '#e53e3e', 2, -2)}
                    ${createAngleArc(C, E, B, 22, 'x', '#2b6cb0')}
                `;
                qText.innerHTML = `${badge}<b>題目：</b>已知 $DBC$ 及 $ACE$ 均為一直線。求未知角 $x = \\angle BCE$。`;
                solText.innerHTML = `<b>詳細解題步驟：</b>
                $$\\begin{aligned}
                \\angle ABC + \\angle ABD &= 180^\\circ && (\\text{adj. } \\angle\\text{s on a st. line}) \\\\
                \\angle ABC &= 180^\\circ - ${extABD}^\\circ = ${angleABC}^\\circ \\\\
                x &= \\angle BAC + \\angle ABC && (\\text{ext. } \\angle \\text{ of } \\Delta) \\\\
                x &= ${angleA}^\\circ + ${angleABC}^\\circ \\\\
                x &= ${ans}^\\circ
                \\end{aligned}$$`;
            } else {
                const xAngle = getRandomInt(25, 40);
                const angleB = getRandomInt(35, 55);
                const angleACE = 2 * xAngle + angleB; 
                
                const B = {x: 100, y: 220}, C = {x: 320, y: 220}, E = {x: 450, y: 220};
                const radB = angleB * Math.PI / 180;
                const radC = Math.PI - (2 * xAngle * Math.PI / 180) - radB;
                
                let distBC = 220;
                let h = distBC * Math.sin(radB) * Math.sin(radC) / Math.sin(2 * xAngle * Math.PI / 180);

                const A = {x: B.x + distAB * Math.cos(radB), y: B.y - distAB * Math.sin(radB)};
                
                const radDAB = xAngle * Math.PI / 180;
                const angleADB = 180 - angleB - xAngle;
                const distBD = distAB * Math.sin(radDAB) / Math.sin(angleADB * Math.PI / 180);
                const D = {x: B.x + distBD, y: 220};

                svg.innerHTML = `

                    ${createAngleArc(B, C, A, 25, `${angleB}^\\circ`)}

                    ${createArcTick(A, B, D, 40, '#2b6cb0')}
                    ${createArcTick(A, D, C, 40, '#2b6cb0')}
                `;

                qText.innerHTML = `${badge}<b>題目：</b>已知 $BCE$ 為一直線，$AD$ 是 $\\angle BAC$ 的角平分線（即 $\\angle BAD = \\angle DAC$）。求未知角 $x = \\angle BAD$。`;
                solText.innerHTML = `<b>詳細解題步驟：</b>
                $$\\begin{aligned}
                \\angle BAC + \\angle ABC &= \\angle ACE && (\\text{ext. } \\angle \\text{ of } \\Delta) \\\\
                \\angle BAC + ${angleB}^\\circ &= ${angleACE}^\\circ \\\\
                \\angle BAC &= ${2 * xAngle}^\\circ \\\\
                \\because AD \\text{ bisects } \\angle BAC \\\\
                \\therefore x &= \\frac{\\angle BAC}{2} \\\\
                x &= \\frac{${2 * xAngle}^\\circ}{2} \\\\
                x &= ${xAngle}^\\circ
                \\end{aligned}$$`;
            }
        }
    }

            solText.innerHTML = `<b>詳細解題步驟：</b>

            \\therefore \\angle ACB &= \\angle ABC = x && (\\text{base } \\angle\\text{s, isos. } \\Delta) \\\\

                \\angle DBC &= ${angleDBC}^\\circ \\\\
                \\angle ABC &= 60^\\circ && (\\text{prop. of equil. } \\Delta) \\\\
                x &= \\angle ABC + \\angle DBC \\\\
                x &= 60^\\circ + ${angleDBC}^\\circ \\\\
                x &= ${ans}^\\circ
                \\end{aligned}$$`;
            }
        }
    }

                currentSum += a;

            const ans = sum - currentSum;
            
            const cx = 260, cy = 140, R = 100, pts = [];

            for(let i = 0; i < n; i++) {

                solText.innerHTML = `<b>詳細解題步驟：</b>

                \\because AB &= BC \\\\

                    ${createVertexLabel(A, 'A', 0, -15)} ${createVertexLabel(B, 'B', 12, -5)}

                    ${createAngleArc(C, B, D, 20, '120^\\circ')} ${createAngleArc(D, C, E, 20, '100^\\circ')} ${createAngleArc(E, D, A, 20, '105^\\circ')}
                `;
                qText.innerHTML = `${badge}<b>題目：</b>已知五邊形 $ABCDE$ 的四個內角分別為 $110^\\circ, 120^\\circ, 100^\\circ, 105^\\circ$，求未知內角 $x$。`;
                solText.innerHTML = `<b>詳細解題步驟：</b>
                $$\\begin{aligned}
                \\text{Sum of int. } \\angle\\text{s of pentagon} &= (5 - 2) \\times 180^\\circ = 540^\\circ && (\\text{sum of polygon}) \\\\
                x + 110^\\circ + 120^\\circ + 100^\\circ + 105^\\circ &= 540^\\circ \\\\
                x &= 105^\\circ
                \\end{aligned}$$`;
            } else if (variant === 3) {
                const cx = 260, cy = 160, R = 130, pts = [];
                for(let i=0; i<6; i++) pts.push({x: cx + R * Math.cos((-90 + i * 60) * Math.PI / 180), y: cy + R * Math.sin((-90 + i * 60) * Math.PI / 180)});
                const [A, B, C, D, E, F] = pts;
                svg.innerHTML = `
                    <polygon points="${pts.map(p => `${p.x},${p.y}`).join(' ')}" fill="none" stroke="#2d3748" stroke-width="2"/>
                    ${createVertexLabel(A, 'A', 0, -15)} ${createVertexLabel(B, 'B', 15, -5)}
                    ${createVertexLabel(C, 'C', 15, 12)} ${createVertexLabel(D, 'D', 0, 15)} 
                    ${createVertexLabel(E, 'E', -15, 12)} ${createVertexLabel(F, 'F', -15, -5)}
                    ${createAngleArc(A, F, B, 25, 'x')} 
                    ${createAngleArc(B, A, C, 25, 'x+10^\\circ', '#e53e3e', 10, 5)}
                    ${createAngleArc(C, B, D, 25, 'x+20^\\circ', '#e53e3e', -5, 10)} 
                    ${createAngleArc(D, C, E, 25, '2x')}
                    ${createAngleArc(E, D, F, 25, '2x-10^\\circ', '#e53e3e', -10, -5)} 
                    ${createAngleArc(F, E, A, 25, '2x-20^\\circ', '#e53e3e', -15, -10)}
                `;
                qText.innerHTML = `${badge}<b>題目：</b>已知六邊形 $ABCDEF$ 中各內角如圖所示。求未知數 $x$ 的值。`;
                solText.innerHTML = `<b>詳細解題步驟：</b>

                \\text{Sum of int. } \\angle\\text{s of hexagon} &= (6 - 2) \\times 180^\\circ = 720^\\circ && (\\text{sum of polygon}) \\\\
                x + (x+10) + (x+20) + 2x + (2x-10) + (2x-20) &= 720^\\circ \\\\
                8x &= 720^\\circ \\\\
                x &= 90^\\circ
                \\end{aligned}$$`;
            } else {
                const validPairs = [[4, 5], [4, 6], [4, 8], [5, 6], [5, 8], [6, 8]];
                const pair = validPairs[getRandomInt(0, validPairs.length - 1)];
                const n1 = pair[0], n2 = pair[1];
                
                let L = 70;
                let A = {x: 260, y: 110}, B = {x: 260, y: 110 + L};
                
                function getPoly(ptA, ptB, n, sign) {
                    let pts = [ptA, ptB];
                    let dir = Math.atan2(ptB.y - ptA.y, ptB.x - ptA.x);
                    let ext = (360 / n) * Math.PI / 180;
                    let currentDir = dir;
                    for(let i=0; i<n-2; i++) {
                        currentDir += sign * ext;
                        let last = pts[pts.length-1];
                        pts.push({x: last.x + L * Math.cos(currentDir), y: last.y + L * Math.sin(currentDir)});
                    }
                    return pts;
                }
                
                let poly1 = getPoly(A, B, n1, 1);
                let poly2 = getPoly(A, B, n2, -1);
                
                let P = poly1[poly1.length - 1];
                let Q = poly2[poly2.length - 1];
                
                const polyNames = {
                    4: '正方形 (Square)',
                    5: '正五邊形 (Regular pentagon)',
                    6: '正六邊形 (Regular hexagon)',
                    8: '正八邊形 (Regular octagon)'
                };
                
                let int1 = (n1 - 2) * 180 / n1;
                let int2 = (n2 - 2) * 180 / n2;
                let paq = 360 - int1 - int2;
                let ans = (180 - paq) / 2;
                
                svg.innerHTML = `
                    <polygon points="${poly1.map(p => `${p.x},${p.y}`).join(' ')}" fill="none" stroke="#2d3748" stroke-width="2"/>
                    <polygon points="${poly2.map(p => `${p.x},${p.y}`).join(' ')}" fill="none" stroke="#2d3748" stroke-width="2"/>
                    <line x1="${P.x}" y1="${P.y}" x2="${Q.x}" y2="${Q.y}" stroke="#2b6cb0" stroke-width="2" stroke-dasharray="4,4"/>
                    ${createVertexLabel(A, 'A', 0, -15)}
                    ${createVertexLabel(B, 'B', 0, 15)}
                    ${createVertexLabel(P, 'P', -15, -15)}
                    ${createVertexLabel(Q, 'Q', 15, -15)}
                    ${createAngleArc(P, A, Q, 25, 'x', '#2b6cb0', -5, -5)}
                `;
                qText.innerHTML = `${badge}<b>題目：</b>圖中有兩個正多邊形並列，分別是${polyNames[n1]}及${polyNames[n2]}，它們共用邊 $AB$。求未知角 $x = \\angle APQ$。`;
                solText.innerHTML = `<b>詳細解題步驟：</b>
                $$\\begin{aligned}
                \\text{Int. } \\angle \\text{ of } ${n1}\\text{-gon} &= \\frac{(${n1} - 2) \\times 180^\\circ}{${n1}} = ${int1}^\\circ \\\\
                \\text{Int. } \\angle \\text{ of } ${n2}\\text{-gon} &= \\frac{(${n2} - 2) \\times 180^\\circ}{${n2}} = ${int2}^\\circ \\\\
                \\angle PAQ &= 360^\\circ - ${int1}^\\circ - ${int2}^\\circ = ${paq}^\\circ \\\\
                \\because AP &= AB = AQ \\text{ (sides of regular polygons)} \\\\
                \\therefore \\angle AQP &= \\angle APQ = x && (\\text{base } \\angle\\text{s, isos. } \\Delta) \\\\
                2x + ${paq}^\\circ &= 180^\\circ && (\\angle\\text{ sum of } \\Delta) \\\\
                2x &= ${180 - paq}^\\circ \\\\
                x &= ${ans}^\\circ
                \\end{aligned}$$`;
            }
        }
    }

                currentSum += a;
            }
            const ans = 360 - currentSum;
            
            const cx = 260, cy = 140, R = 90, pts = [];

            const extNames = ['P', 'Q', 'R', 'S', 'T', 'U'];
            for(let i = 0; i < n; i++) {
                pts.push({
                    x: cx + R * Math.cos((-90 + i * (360/n)) * Math.PI / 180),

            }
            
            let polySvg = `<polygon points="${pts.map(p => `${p.x},${p.y}`).join(' ')}" fill="none" stroke="#2d3748" stroke-width="2"/>`;
            let extLinesSvg = '', arcsSvg = '', labelsSvg = '', extPts = [], sumStr = '';

                extLinesSvg += `<line x1="${pts[(i+1)%n].x}" y1="${pts[(i+1)%n].y}" x2="${e.x}" y2="${e.y}" stroke="#718096" stroke-width="1.8" stroke-dasharray="4,4"/>`;
                
                let a = Math.atan2(pts[i].y - cy, pts[i].x - cx);
                labelsSvg += createVertexLabel({x: pts[i].x + 15*Math.cos(a), y: pts[i].y + 15*Math.sin(a)}, labels[i], -10, -10);
                labelsSvg += createVertexLabel({x: e.x + 5*Math.cos(a), y: e.y + 5*Math.sin(a)}, extNames[i], 0, 0);
            }
            
            for (let i = 0; i < n; i++) {
                let curr = pts[(i+1)%n]; 
                let next = pts[(i+2)%n];
                let extP = extPts[i];
                if (i === n - 1) { 
                    arcsSvg += createAngleArc(curr, next, extP, 22, 'x', '#2b6cb0');
                } else {
                    arcsSvg += createAngleArc(curr, next, extP, 22, `${extAngles[i]}^\\circ`);
                    sumStr += `${extAngles[i]}^\\circ + `;
                }
            }
            sumStr = sumStr.slice(0, -3);
            
            let polyName = n === 4 ? '四邊形' : (n === 5 ? '五邊形' : '六邊形');
            let polyStr = labels.slice(0, n).join('');
            
            svg.innerHTML = polySvg + extLinesSvg + arcsSvg + labelsSvg;
            qText.innerHTML = `${badge}<b>題目：</b>求圖中凸${polyName} $${polyStr}$ 的未知外角 $x$。`;
            solText.innerHTML = `<b>詳細解題步驟：</b>
            $$\\begin{aligned}
            \\text{Sum of ext. } \\angle\\text{s of polygon} &= 360^\\circ && (\\text{sum of ext. } \\angle \\text{s of polygon}) \\\\
            x + ${sumStr} &= 360^\\circ \\\\
            x + ${currentSum}^\\circ &= 360^\\circ \\\\
            x &= ${ans}^\\circ
            \\end{aligned}$$`;
        } else {
            const variant = getRandomInt(1, 4);
            if (variant === 1) {
                const n = getRandomInt(4, 6);
                let extAngles = [];
                let currentSum = 0;
                for (let i = 0; i < n - 1; i++) {
                    let a = getRandomInt(Math.floor(360/n) - 15, Math.floor(360/n) + 15);
                    extAngles.push(a);
                    currentSum += a;
                }
                const ans = 360 - currentSum; 
                const intA = 180 - extAngles[0];
                
                const cx = 260, cy = 140, R = 90, pts = [];
                const labels = ['A', 'B', 'C', 'D', 'E', 'F'];
                const extNames = ['P', 'Q', 'R', 'S', 'T', 'U'];
                for(let i = 0; i < n; i++) {
                    pts.push({
                        x: cx + R * Math.cos((-90 + i * (360/n)) * Math.PI / 180), 
                        y: cy + R * Math.sin((-90 + i * (360/n)) * Math.PI / 180)
                    });
                }
                
                let polySvg = `<polygon points="${pts.map(p => `${p.x},${p.y}`).join(' ')}" fill="none" stroke="#2d3748" stroke-width="2"/>`;
                let extLinesSvg = '', arcsSvg = '', labelsSvg = '', extPts = [];
                
                for (let i = 0; i < n; i++) {
                    let e = getExtendedPoint(pts[i], pts[(i + 1) % n], 50);
                    extPts.push(e);
                    if (i !== 0) {
                        extLinesSvg += `<line x1="${pts[(i+1)%n].x}" y1="${pts[(i+1)%n].y}" x2="${e.x}" y2="${e.y}" stroke="#718096" stroke-width="1.8" stroke-dasharray="4,4"/>`;
                        let a = Math.atan2(pts[i].y - cy, pts[i].x - cx);
                        labelsSvg += createVertexLabel({x: e.x + 5*Math.cos(a), y: e.y + 5*Math.sin(a)}, extNames[i], 0, 0);
                    }
                    let a = Math.atan2(pts[i].y - cy, pts[i].x - cx);
                    labelsSvg += createVertexLabel({x: pts[i].x + 15*Math.cos(a), y: pts[i].y + 15*Math.sin(a)}, labels[i], -10, -10);
                }
                
                let sumStr = '';
                for (let i = 0; i < n; i++) {
                    let curr = pts[(i+1)%n]; 
                    let next = pts[(i+2)%n];
                    let prev = pts[i];
                    let extP = extPts[i];
                    
                    if (i === 0) {
                        arcsSvg += createAngleArc(curr, prev, next, 22, `${intA}^\\circ`);
                        sumStr += `${extAngles[0]}^\\circ + `;
                    } else if (i === n - 1) { 
                        arcsSvg += createAngleArc(curr, next, extP, 22, 'x', '#2b6cb0');
                    } else {
                        arcsSvg += createAngleArc(curr, next, extP, 22, `${extAngles[i]}^\\circ`);
                        sumStr += `${extAngles[i]}^\\circ + `;
                    }
                }
                sumStr = sumStr.slice(0, -3);
                
                let polyName = n === 4 ? '四邊形' : (n === 5 ? '五邊形' : '六邊形');
                let polyStr = labels.slice(0, n).join('');
                let intVertex = labels[1];
                let prevVertex = labels[0];
                let nextVertex = labels[2];
                
                svg.innerHTML = polySvg + extLinesSvg + arcsSvg + labelsSvg;
                qText.innerHTML = `${badge}<b>題目：</b>已知凸${polyName} $${polyStr}$ 中，內角 $\\angle ${prevVertex}${intVertex}${nextVertex} = ${intA}^\\circ$。求未知外角 $x$。`;
                solText.innerHTML = `<b>詳細解題步驟：</b>
                $$\\begin{aligned}
                \\text{Ext. } \\angle \\text{ at } ${intVertex} + \\angle ${prevVertex}${intVertex}${nextVertex} &= 180^\\circ && (\\text{adj. } \\angle\\text{s on a st. line}) \\\\
                \\text{Ext. } \\angle \\text{ at } ${intVertex} &= 180^\\circ - ${intA}^\\circ = ${extAngles[0]}^\\circ \\\\
                \\text{Sum of ext. } \\angle\\text{s of polygon} &= 360^\\circ && (\\text{sum of ext. } \\angle \\text{s of polygon}) \\\\
                x + ${sumStr} &= 360^\\circ \\\\
                x &= ${ans}^\\circ
                \\end{aligned}$$`;
            } else if (variant === 2) {
                let cx = 260, cy = 140, R = 95, pts = [];
                for(let i=0; i<8; i++) pts.push({x: cx + R * Math.cos((-90 + i * 45) * Math.PI / 180), y: cy + R * Math.sin((-90 + i * 45) * Math.PI / 180)});
                let ext = getExtendedPoint(pts[0], pts[1], 50);

                svg.innerHTML = `
                    <circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="#cbd5e0" stroke-dasharray="4,4"/>
                    <polygon points="${pts.map(p => `${p.x},${p.y}`).join(' ')}" fill="none" stroke="#2d3748" stroke-width="2"/>
                    <line x1="${pts[1].x}" y1="${pts[1].y}" x2="${ext.x}" y2="${ext.y}" stroke="#718096" stroke-width="1.8" stroke-dasharray="4,4"/>
                    ${createAngleArc(pts[1], ext, pts[2], 22, 'x', '#2b6cb0')}
                `;
                qText.innerHTML = `${badge}<b>題目：</b>求正八邊形（Regular octagon）每個外角 $x$ 的度數。`;
                solText.innerHTML = `<b>詳細解題步驟：</b>
                $$\\begin{aligned}
                \\text{Sum of ext. } \\angle\\text{s of polygon} &= 360^\\circ && (\\text{sum of ext. } \\angle\\text{s of polygon}) \\\\
                8x &= 360^\\circ \\\\
                x &= 45^\\circ
                \\end{aligned}$$`;
            } else if (variant === 3) {
                const k = getRandomInt(2, 4); 
                const n = (k * 2) + 2; 
                let cx = 260, cy = 250, R = 150, pts = [];
                for(let i=0; i<5; i++) pts.push({x: cx + R * Math.cos((210 + i * (360/n)) * Math.PI / 180), y: cy + R * Math.sin((210 + i * (360/n)) * Math.PI / 180)});
                
                svg.innerHTML = `
                    <polyline points="${pts.map(p => `${p.x},${p.y}`).join(' ')}" fill="none" stroke="#2d3748" stroke-width="2"/>
                    <path d="M ${pts[0].x} ${pts[0].y} Q 260 210 ${pts[4].x} ${pts[4].y}" fill="none" stroke="#cbd5e0" stroke-width="2" stroke-dasharray="6,6"/>
                    <foreignObject x="220" y="150" width="80" height="30">
                        <div xmlns="http://www.w3.org/1999/xhtml" class="math-label" style="font-size: 16px;">$n$ sides</div>
                    </foreignObject>
                `;
                qText.innerHTML = `${badge}<b>題目：</b>已知一個正多邊形（Regular polygon）的內角和是其外角和的 ${k} 倍。求該多邊形的邊數 $n$。`;
                solText.innerHTML = `<b>詳細解題步驟：</b>
                $$\\begin{aligned}
                \\text{Sum of ext. } \\angle\\text{s} &= 360^\\circ && (\\text{sum of ext. } \\angle\\text{s of polygon}) \\\\
                \\text{Sum of int. } \\angle\\text{s} &= ${k} \\times 360^\\circ = ${k * 360}^\\circ \\\\
                (n - 2) \\times 180^\\circ &= ${k * 360}^\\circ && (\\text{sum of polygon}) \\\\
                n - 2 &= ${k * 2} \\\\
                n &= ${n}
                \\end{aligned}$$`;
            } else {
                const sides = [10, 12, 18];
                const n = sides[getRandomInt(0, 2)];
                const ext = 360 / n;
                const intA = 180 - ext;
                const diff = intA - ext;
                
                svg.innerHTML = `
                    <line x1="120" y1="200" x2="400" y2="200" stroke="#718096" stroke-width="1.8" stroke-dasharray="4,4"/>
                    <line x1="260" y1="200" x2="${260 + 120*Math.cos((180-ext)*Math.PI/180)}" y2="${200 - 120*Math.sin((180-ext)*Math.PI/180)}" stroke="#2d3748" stroke-width="2"/>
                    <line x1="260" y1="200" x2="140" y2="200" stroke="#2d3748" stroke-width="2"/>
                    ${createAngleArc({x:260, y:200}, {x:140, y:200}, {x:260 + 120*Math.cos((180-ext)*Math.PI/180), y:200 - 120*Math.sin((180-ext)*Math.PI/180)}, 30, 'x', '#2b6cb0')}
                    ${createAngleArc({x:260, y:200}, {x:260 + 120*Math.cos((180-ext)*Math.PI/180), y:200 - 120*Math.sin((180-ext)*Math.PI/180)}, {x:400, y:200}, 30, 'y')}
                    <foreignObject x="220" y="80" width="80" height="30">
                        <div xmlns="http://www.w3.org/1999/xhtml" class="math-label" style="font-size: 16px;">$n$-gon</div>
                    </foreignObject>
                `;
                qText.innerHTML = `${badge}<b>題目：</b>已知一個正 $n$ 邊形的每一內角 $x$ 比其每一外角 $y$ 大 $${diff}^\\circ$。求邊數 $n$。`;
                solText.innerHTML = `<b>詳細解題步驟：</b>
                $$\\begin{aligned}
                x + y &= 180^\\circ && (\\text{adj. } \\angle\\text{s on a st. line}) \\\\
                x - y &= ${diff}^\\circ && (\\text{given}) \\\\
                (x + y) - (x - y) &= 180^\\circ - ${diff}^\\circ \\\\
                2y &= ${180 - diff}^\\circ \\\\
                y &= ${ext}^\\circ \\\\
                \\text{Ext. } \\angle \\text{ of regular } n\\text{-gon} &= \\frac{360^\\circ}{n} && (\\text{sum of ext. } \\angle\\text{s of polygon}) \\\\
                ${ext}^\\circ &= \\frac{360^\\circ}{n} \\\\
                n &= ${n}
                \\end{aligned}$$`;
            }
        }
    }

    // 初始頁面加載生成首題
    window.onload = generateQuestion;
</script>
